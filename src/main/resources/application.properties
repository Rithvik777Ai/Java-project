spring.application.name=curatransit
server.port=${PORT:8080}

# H2 In-Memory Database for clean demo persistence
spring.datasource.url=jdbc:h2:mem:curatransitdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible to Admin)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Metadata
app.name=CuraTransit – Smart Hospital Finder and Appointment Booking System
app.state=Tamil Nadu
app.demo-notice=Demo website. Hospital listings and appointment availability are sample data and must be verified directly with the hospital.

# TextBee.dev SMS Gateway Configuration
textbee.api.key=${TEXTBEE_API_KEY:}
textbee.device.id=${TEXTBEE_DEVICE_ID:}
textbee.api.url=${TEXTBEE_API_URL:https://api.textbee.dev/api/v1}
textbee.enabled=${TEXTBEE_ENABLED:false}
