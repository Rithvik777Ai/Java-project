<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted - Tamil Nadu Smart Hospital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container" style="text-align: center; padding: 64px 24px;">
    <div style="font-size: 5rem; line-height: 1; font-weight: 800; color: #dc2626; margin-bottom: 12px;">403</div>
    <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px;">Access Restricted</h1>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 28px;">
        You do not have the required role credentials to view this dashboard section. Please switch roles using the 1-Click Demo Login.
    </p>

    <div style="display: flex; gap: 12px; justify-content: center;">
        <a th:href="@{/login}" class="btn btn-primary">Switch Demo Role</a>
        <a th:href="@{/}" class="btn btn-outline">Back to Home</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
