<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<header th:fragment="header" class="site-header">
    <!-- Main Navigation Bar -->
    <div class="navbar-container">
        <a th:href="@{/}" class="brand-logo" aria-label="Tamil Nadu Smart Hospital Home">
            <div class="brand-icon">🏥</div>
            <div class="brand-text">
                <span class="brand-title">Tamil Nadu Smart Hospital</span>
                <span class="brand-sub">Healthcare &amp; Medical Transit Hub</span>
            </div>
        </a>

        <!-- Desktop Navigation Links -->
        <ul class="nav-links" id="mainNav">
            <li><a th:href="@{/}" class="nav-link">Home</a></li>
            <li><a th:href="@{/hospitals}" class="nav-link">Find Hospitals</a></li>
            <li><a th:href="@{/doctors}" class="nav-link">Find Doctors</a></li>
            <li><a th:href="@{/#specialties}" class="nav-link">Specialties</a></li>
            <li><a th:href="@{/about}" class="nav-link">About Us</a></li>
            <li><a th:href="@{/#contact}" class="nav-link">Contact</a></li>
            <li><a th:href="@{/hospitals/compare}" class="nav-link" style="color: var(--secondary);">⚖️ Compare</a></li>
        </ul>

        <!-- Auth & Dashboard Navigation Actions -->
        <div class="nav-actions">
            <!-- Anonymous Visitor -->
            <div sec:authorize="!isAuthenticated()" style="display: flex; gap: 8px; align-items: center;">
                <a th:href="@{/login}" class="btn btn-outline btn-sm">Sign In</a>
                <a th:href="@{/dashboard}" class="btn btn-primary btn-sm" title="Explore Demo Role Dashboards">⚡ Demo Dashboard</a>
            </div>

            <!-- Authenticated User -->
            <div sec:authorize="isAuthenticated()" style="display: flex; gap: 10px; align-items: center;">
                <a th:href="@{/dashboard}" class="user-menu-pill" title="Open Your Role Dashboard">
                    <span class="user-avatar-tiny">👤</span>
                    <span sec:authentication="name" style="max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">User</span>

                    <span sec:authorize="hasRole('ADMIN')" class="badge badge-teal" style="font-size: 0.65rem;">ADMIN</span>
                    <span sec:authorize="hasRole('DOCTOR')" class="badge badge-blue" style="font-size: 0.65rem;">DOCTOR</span>
                    <span sec:authorize="hasRole('PATIENT')" class="badge badge-green" style="font-size: 0.65rem;">PATIENT</span>
                </a>

                <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                    <button type="submit" class="btn btn-outline btn-sm" style="padding: 4px 8px; color: #dc2626;" title="Sign Out">Sign Out</button>
                </form>
            </div>

            <!-- Mobile Hamburger Toggle -->
            <button type="button" class="mobile-nav-toggle" id="mobileNavBtn" aria-label="Toggle Navigation Menu">☰</button>
        </div>
    </div>
</header>

</body>
</html>
