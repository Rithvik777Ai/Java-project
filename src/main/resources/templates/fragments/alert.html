<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span style="font-size: 1.25rem;">✓</span>
        <span th:text="${successMessage}">Operation successful!</span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span style="font-size: 1.25rem;">⚠️</span>
        <span th:text="${errorMessage}">An error occurred.</span>
    </div>

    <div th:if="${bookingError}" class="alert alert-danger" role="alert">
        <span style="font-size: 1.25rem;">⚠️</span>
        <span th:text="${bookingError}">Booking conflict.</span>
    </div>

    <div th:if="${warningMessage}" class="alert alert-warning" role="alert">
        <span style="font-size: 1.25rem;">ℹ️</span>
        <span th:text="${warningMessage}">Warning note.</span>
    </div>

    <div th:if="${infoMessage}" class="alert alert-info" role="alert">
        <span style="font-size: 1.25rem;">ℹ️</span>
        <span th:text="${infoMessage}">Information.</span>
    </div>
</div>

</body>
</html>
